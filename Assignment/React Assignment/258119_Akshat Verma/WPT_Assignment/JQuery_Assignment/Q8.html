<!DOCTYPE html>
<html>
<head>
    <title>Form Details</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        input, select, button {
            display: block;
            margin: 5px 0 15px 0;
        }
        .error {
            color: red;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Enter Your Details</h2>
    <form id="detailsForm">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Lucky Number:</label>
        <input type="text" id="luckyNumber" placeholder="Enter 4-digit lucky number">

        <label>Age:</label>
        <input type="number" id="age" placeholder="Enter your age">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label>Country:</label>
        <input type="text" id="country" placeholder="Enter your country">

        <button type="submit">Submit</button>
        <p class="error" id="errorMsg"></p>
    </form>

    <script>
        $(document).ready(function() {
            $('#detailsForm').submit(function(event) {
                event.preventDefault();
                $('#errorMsg').text("");

                let name = $('#name').val().trim();
                let luckyNumber = $('#luckyNumber').val().trim();
                let age = $('#age').val().trim();
                let email = $('#email').val().trim();
                let country = $('#country').val().trim();

                // Validation
                if (!name || !luckyNumber || !age || !email || !country) {
                    $('#errorMsg').text("All fields are mandatory.");
                    return;
                }

                // Name: only alphabets, max 10 characters
                let nameRegex = /^[A-Za-z]{1,10}$/;
                if (!nameRegex.test(name)) {
                    $('#errorMsg').text("Name must be only alphabets and maximum 10 characters.");
                    return;
                }

                // Lucky Number: 4 digits
                let luckyNumberRegex = /^\d{4}$/;
                if (!luckyNumberRegex.test(luckyNumber)) {
                    $('#errorMsg').text("Lucky Number must be a 4-digit number.");
                    return;
                }

                // Create object with all details
                let person = {
                    Name: name,
                    LuckyNumber: luckyNumber,
                    Age: age,
                    Email: email,
                    Country: country
                };

                // Open new window and display details
                let newWindow = window.open("", "Person Details", "width=400,height=400");
                newWindow.document.write("<h3>Person Details</h3>");
                newWindow.document.write("<table border='1' cellpadding='5' cellspacing='0'>");
                newWindow.document.write("<tr><th>Field</th><th>Value</th></tr>");
                for (let key in person) {
                    newWindow.document.write(`<tr><td>${key}</td><td>${person[key]}</td></tr>`);
                }
                newWindow.document.write("</table>");
            });
        });
    </script>
</body>
</html>
